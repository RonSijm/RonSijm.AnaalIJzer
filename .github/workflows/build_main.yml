---
name: .NET
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{secrets.NUGET_API_KEY}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history required for SourceLink
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check generated docs, schema, and links
        shell: pwsh
        run: ./build/Scripts/Docs/check-docs.ps1
      - name: Restore cross-platform test graph
        run: dotnet restore src/RonSijm.AnaalIJzer.CrossPlatform.slnx
      - name: Run cross-platform tests
        shell: pwsh
        run: ./build/Scripts/Testing/test-all.ps1 -Configuration Debug -SkipWindowsOnly -NoRestore -CollectCoverage -ResultsDirectory ./coverage
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          directory: ./coverage
          fail_ci_if_error: true
          verbose: true
      - name: Build, pack, and publish when version changes
        shell: pwsh
        run: ./build/Scripts/Packages/build-when-nuget-version-changed.ps1 -SkipTests
      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnaalIJzer-NuGet
          path: |
            build/Artifacts/Packages/*.nupkg
            build/Artifacts/Packages/*.snupkg
  build-windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history required for SourceLink
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build graph editor artifact
        run: build\Scripts\GraphEditor\build-graph-editor-standalone.bat
      - name: Test graph editor WPF support code
        run: dotnet test src\Tests\RonSijm.AnaalIJzer.GraphEditor.Wpf.Tests\RonSijm.AnaalIJzer.GraphEditor.Wpf.Tests.csproj --configuration Release
      - name: Upload graph editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnaalIJzer-GraphEditor-Standalone
          path: build\Artifacts\GraphEditor.Standalone\**
      - name: Package graph editor release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: graph_editor_release
        shell: pwsh
        run: |
          [xml]$versioning = Get-Content -LiteralPath build\Settings\NuGetVersioning.props
          $version = [string]$versioning.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "VersionPrefix was not found in build\Settings\NuGetVersioning.props."
          }

          $artifactDirectory = Resolve-Path -LiteralPath build\Artifacts\GraphEditor.Standalone
          $releaseDirectory = Join-Path (Resolve-Path .).Path "build\Artifacts\Releases"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          $zipRelativePath = "build/Artifacts/Releases/AnaalIJzer-GraphEditor-Standalone-$version.zip"
          $zipFullPath = Join-Path (Resolve-Path .).Path ($zipRelativePath -replace '/', '\')
          if (Test-Path -LiteralPath $zipFullPath) {
            Remove-Item -LiteralPath $zipFullPath -Force
          }

          Compress-Archive -Path (Join-Path $artifactDirectory "*") -DestinationPath $zipFullPath -Force

          "tag=graph-editor-v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=AnaalIJzer Graph Editor $version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file=$zipRelativePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish graph editor release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.graph_editor_release.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ steps.graph_editor_release.outputs.name }}
          body: Standalone WPF graph editor for AnaalIJzer architecture settings.
          files: ${{ steps.graph_editor_release.outputs.file }}
          overwrite_files: true
